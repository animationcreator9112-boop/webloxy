  --text: #f4f6ff; --mut: #9aa4cc; --gold: #ffc94d; --green: #2ee59d; --green2: #12b57a; --red: #ff5470; --blue: #5b7cff; --acc: linear-gradient(135deg, #6d7cff, #9b5cff);
  --font: 'Inter', 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --r: 18px; --glass: blur(18px) saturate(140%); --sh: 0 8px 30px rgba(0,0,0,.35); }
body { font-weight: 500; letter-spacing: .005em; }
.card, .modal, .gcard, .item, .prow, .stat, .balbox, .xch, .dockbtn, .hpanel, .spanel, .phone { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--sh); }
.card, .modal, .hpanel, .spanel { -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); }
.item, .gcard, .prow { box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.card, .modal { border-radius: 26px; }
.card { box-shadow: 0 24px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.modal { animation: pop .22s cubic-bezier(.2,.9,.3,1.2); box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
.logo { font-weight: 800; letter-spacing: -1px; }
.logo .w { background: linear-gradient(135deg, #ffd86b, #ff9d3d); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 14px rgba(255,170,60,.35)); }
.logo .b { text-shadow: none; filter: drop-shadow(0 4px 14px rgba(109,124,255,.5)); }
.cube3d { background: var(--acc); box-shadow: 0 10px 26px rgba(109,124,255,.5); border-radius: 12px; }
.inp { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 14px; transition: border-color .15s, box-shadow .15s, background .15s; }
.inp:focus { border-color: #8e9cff; box-shadow: 0 0 0 4px rgba(109,124,255,.22); background: rgba(255,255,255,.09); }
.btn { background: var(--acc); border-radius: 14px; font-weight: 700; box-shadow: 0 8px 22px rgba(109,124,255,.38), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .12s, box-shadow .12s, filter .12s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.98); box-shadow: 0 3px 10px rgba(109,124,255,.35); }
.btn.green { background: linear-gradient(135deg, #2ee59d, #12b57a); color: #04281b; box-shadow: 0 8px 22px rgba(46,229,157,.3), inset 0 1px 0 rgba(255,255,255,.3); }
.btn.green:active { box-shadow: 0 3px 10px rgba(46,229,157,.3); }
.btn.gold { background: linear-gradient(135deg, #ffd86b, #ff9d3d); color: #3a2400; box-shadow: 0 8px 22px rgba(255,170,60,.32), inset 0 1px 0 rgba(255,255,255,.4); }
.btn.gold:active { box-shadow: 0 3px 10px rgba(255,170,60,.3); }
.btn.red { background: linear-gradient(135deg, #ff6b86, #e0334f); box-shadow: 0 8px 22px rgba(255,84,112,.32), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.red:active { box-shadow: 0 3px 10px rgba(255,84,112,.3); }
.btn.sm, .item .btn { box-shadow: 0 4px 12px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2); }
.item .btn.on { background: rgba(255,255,255,.14); box-shadow: none; }
.xbtn { background: rgba(255,255,255,.1); border: 1px solid var(--line); box-shadow: none; border-radius: 50%; color: #fff; transition: background .15s, transform .12s; }
.xbtn:hover { background: var(--red); } .xbtn:active { transform: scale(.92); box-shadow: none; }
.ghost, .tab, .quick button { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 999px; transition: background .15s, transform .12s; }
.ghost:hover, .tab:hover { background: rgba(255,255,255,.13); }
.tab.on { background: var(--acc); border-color: transparent; box-shadow: 0 6px 18px rgba(109,124,255,.4); }
.prof, .wbtn, .chip, .search .inp { background: rgba(255,255,255,.07); border: 1px solid var(--line); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); }
.wbtn { border-color: rgba(255,201,77,.45); box-shadow: 0 0 18px rgba(255,201,77,.12); }
.topbar { background: linear-gradient(180deg, rgba(7,10,24,.7), rgba(7,10,24,0)); }
.av { background: var(--acc); color: #fff; box-shadow: 0 4px 12px rgba(109,124,255,.4); }
h2.sec { font-size: 21px; font-weight: 800; letter-spacing: -.3px; }
.gcard, .item { border-radius: 20px; transition: transform .18s cubic-bezier(.2,.9,.3,1.2), border-color .18s, box-shadow .18s; }
.gcard:hover, .item:hover { transform: translateY(-4px); border-color: rgba(142,156,255,.7); box-shadow: 0 16px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(142,156,255,.35); }
.gcard:active, .item:active { transform: scale(.98); }
.item.eq { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 10px 30px rgba(46,229,157,.18); }
.item .th { background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.14), rgba(255,255,255,.03) 70%); border-radius: 14px; }
.gicon { text-shadow: 0 6px 18px rgba(0,0,0,.3); }
.stat b { background: linear-gradient(135deg, #ffd86b, #ff9d3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dock { background: linear-gradient(0deg, rgba(7,10,24,.75), rgba(7,10,24,0)); }
.dockbtn { border-radius: 22px; font-weight: 700; transition: transform .15s, background .15s; box-shadow: var(--sh); }
.dockbtn:hover { background: rgba(255,255,255,.12); } .dockbtn:active { transform: scale(.96); box-shadow: var(--sh); }
.shop { background: rgba(10,14,34,.55); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); border-left: 1px solid var(--line); }
.cbar { border-top: 1px solid var(--line); background: rgba(10,14,34,.6); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); }
.toast { background: rgba(20,26,56,.92); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.5); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); animation: pop .2s cubic-bezier(.2,.9,.3,1.2); }
.toast.err { background: rgba(90,21,32,.92); } .toast.ok { background: rgba(10,74,42,.92); }
.msg.err { border-radius: 12px; border-width: 1px; }
/* HUD dalam game */
.hbtn, .hchip, .burger, .vbtns button { background: rgba(14,18,42,.55); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); box-shadow: 0 4px 16px rgba(0,0,0,.28); border-radius: 14px; transition: background .15s, transform .12s; }
.hbtn:active, .burger:active { transform: scale(.94); }
.hbtn.on { background: var(--acc); border-color: transparent; }
.hbtn.vox.on { background: linear-gradient(135deg, #2ee59d, #12b57a); }
.hpanel { border-radius: 20px; background: rgba(14,18,42,.82); }
.hgrid button { border-radius: 14px; }
.joy { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.joy .knob { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), rgba(255,255,255,.2)); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.jump { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.chatbox, .chatlog .cl { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.chatbox { border-radius: 18px; border: 1px solid rgba(255,255,255,.14); }
.spanel { border-radius: 20px; background: rgba(14,18,42,.82); }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* menu utama (gaya aplikasi moden): bar kaca gelap, nav terapung, drawer gelap */
.rtop { background: rgba(10,14,34,.72); color: #fff; -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); border-bottom: 1px solid var(--line); }
.rham { background: var(--acc); border-radius: 14px; box-shadow: 0 6px 18px rgba(109,124,255,.4); }
.rib { color: #fff; border-radius: 14px; transition: background .15s; } .rib:active { background: rgba(255,255,255,.12); }
.rsearch { background: transparent; } .rsearch .inp { background: rgba(255,255,255,.08); color: #fff; border: 1px solid var(--line); }
.rsearch .inp::placeholder, .inp::placeholder { color: rgba(255,255,255,.4); }
.rsec { font-weight: 800; letter-spacing: -.3px; text-shadow: none; font-size: 21px; }
.rprofrow { text-shadow: none; font-weight: 800; }
.rfc { text-shadow: none; } .rfc .circ { background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); border: 1px solid var(--line); color: #cfd6ff; box-shadow: 0 8px 22px rgba(0,0,0,.3); }
.rfc .dot { border-color: #0b1030; background: var(--green); }
.rfcard, .rcard { text-shadow: none; transition: transform .18s cubic-bezier(.2,.9,.3,1.2); } .rfcard:active, .rcard:active { transform: scale(.97); }
.rfcard .gicon, .rcard .gicon { border-radius: 22px; box-shadow: 0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25); }
.rfcard .tag2 { background: rgba(10,14,34,.6); color: #fff; border: 1px solid rgba(255,255,255,.25); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.fbbtn { background: rgba(255,255,255,.1); color: #fff; border: 1px solid var(--line); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); }
.rnav { background: rgba(14,18,44,.78); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: 26px; margin: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); padding: 8px 6px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
.rnav button { color: #8d96c2; border-radius: 18px; padding: 6px 0; transition: color .15s, background .15s, transform .12s; } .rnav button:active { transform: scale(.94); }
.rnav button.on, .rnav button.act, .rnav button[aria-current], .rnav button.sel { color: #fff; background: rgba(109,124,255,.25); }
.drawer { background: rgba(14,18,44,.94); color: #f4f6ff; -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); border-right: 1px solid var(--line); border-radius: 0 26px 26px 0; box-shadow: 20px 0 60px rgba(0,0,0,.5); }
.ditem { border-radius: 14px; padding: 12px 10px; transition: background .15s; font-weight: 600; } .ditem:active, .ditem:hover { background: rgba(255,255,255,.09); }
.dbal { border: 1px solid var(--line); background: rgba(255,255,255,.05); border-radius: 16px; }
.dhr { height: 1px; background: var(--line); }
.dsw, .dbuy { background: rgba(255,255,255,.09); color: #fff; border: 1px solid var(--line); border-radius: 14px; }
/* studio: panel cerah dibulatkan */
.stool { border-bottom: 1px solid rgba(0,0,0,.12) !important; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.stool .hbtn, .ptools .hbtn { border-radius: 12px; border-width: 1px; box-shadow: none; }
.spanel.dunia { border-radius: 18px; border-width: 1px; box-shadow: 0 14px 40px rgba(0,0,0,.3); }
.dmenu { border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.gu-win, .annc, .treadhint, .voxui { border-radius: 18px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

.rtop .wm { color: #fff; font-weight: 800; letter-spacing: -.5px; font-size: 22px; } .rtop .wm .y { background: linear-gradient(135deg, #ffd86b, #ff9d3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dbal * { color: inherit; }

/* ===== tempur: inventori, senjata, HP ===== */
.invbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 6px; background: rgba(10,14,34,.62); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 22; max-width: 62vw; overflow-x: auto; }
.invbar button { position: relative; flex: none; width: 54px; height: 54px; padding: 2px; border-radius: 12px; background: rgba(255,255,255,.08); border: 2px solid transparent; display: grid; place-items: center; font-size: 26px; }
.invbar button.on { border-color: #ffd34d; background: rgba(255,211,77,.22); box-shadow: 0 0 14px rgba(255,211,77,.4); }
.invbar img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.invbar i { position: absolute; left: 5px; top: 2px; font-size: 10px; font-style: normal; opacity: .85; }
.ammo { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(240px + env(safe-area-inset-bottom, 0px)); text-align: right; text-shadow: 0 2px 6px #000; z-index: 22; }
.ammo b { display: block; font-size: 26px; letter-spacing: .5px; } .ammo small { color: #cfd6ff; font-size: 12px; }
.firebtn { position: absolute; right: calc(38px + env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; border-radius: 50%; font-size: 34px; background: radial-gradient(circle at 35% 30%, #ff9a6b, #e0334f); border: 3px solid rgba(255,255,255,.6); box-shadow: 0 8px 24px rgba(224,51,79,.5); z-index: 22; touch-action: none; }
.firebtn:active { transform: scale(.94); }
.rlbtn { position: absolute; right: calc(132px + env(safe-area-inset-right, 0px)); bottom: calc(168px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; font-weight: 800; font-size: 20px; background: rgba(14,18,42,.7); border: 2px solid rgba(255,255,255,.4); z-index: 22; touch-action: none; }
.xh { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 21; }
.xh i { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.8); } .xh i:nth-child(1) { left: 12px; top: 0; width: 2px; height: 8px; } .xh i:nth-child(2) { left: 12px; top: 18px; width: 2px; height: 8px; } .xh i:nth-child(3) { left: 0; top: 12px; width: 8px; height: 2px; } .xh i:nth-child(4) { left: 18px; top: 12px; width: 8px; height: 2px; } .xh b { position: absolute; left: 11px; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: #ff4d6d; box-shadow: 0 0 0 1px rgba(0,0,0,.8); }
.rlbar { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); width: 160px; text-align: center; font-size: 12.5px; font-weight: 700; text-shadow: 0 2px 4px #000; z-index: 22; } .rlbar .cbtr i { background: linear-gradient(90deg, #7dffb0, #c9ffd8); transition: none; }
.cbhp { position: absolute; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); width: min(240px, 50vw); display: flex; align-items: center; gap: 8px; z-index: 22; text-shadow: 0 2px 4px #000; }
.cbtr { flex: 1; height: 12px; border-radius: 8px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25); overflow: hidden; } .cbtr i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d6d, #ff9a5c); transition: width .15s; }
.cbzc { position: absolute; left: 50%; transform: translateX(-50%); top: calc(88px + env(safe-area-inset-top, 0px)); font-weight: 700; font-size: 14px; text-shadow: 0 2px 4px #000; z-index: 22; }
.cbboss { position: absolute; left: 50%; transform: translateX(-50%); top: calc(112px + env(safe-area-inset-top, 0px)); width: min(380px, 70vw); text-align: center; z-index: 22; text-shadow: 0 2px 4px #000; } .cbboss .cbtr { height: 14px; margin-top: 3px; } .cbboss .cbtr i { background: linear-gradient(90deg, #8a1aff, #ff3a8a); }
.hurtfx { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255,30,50,.55) 100%); z-index: 21; } .hurtfx.on { animation: hurtA .45s ease-out; } @keyframes hurtA { from { opacity: 1; } to { opacity: 0; } }
.deadfx { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: rgba(60,0,10,.55); z-index: 40; pointer-events: none; } .deadfx b { font-size: 44px; letter-spacing: 3px; color: #ff4d6d; text-shadow: 0 4px 18px #000; }
.wzset .wzmode { display: block; width: 100%; text-align: left; padding: 9px 11px; margin-bottom: 6px; border-radius: 12px; background: rgba(255,255,255,.08); border: 2px solid transparent; color: inherit; } .wzset .wzmode.on { border-color: #3ddc6a; background: rgba(61,220,106,.16); } .wzset .wzmode small { display: block; opacity: .75; font-size: 12px; margin-top: 2px; }

/* Donate Me! */
.dnpanel { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(98px + env(safe-area-inset-top, 0px)); width: 188px; padding: 10px; border-radius: 18px; background: rgba(14,18,42,.8); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); display: flex; flex-direction: column; gap: 6px; z-index: 31; }
.dnrow { display: flex; flex-direction: column; font-size: 11.5px; color: var(--mut); line-height: 1.2; } .dnrow b { font-size: 17px; color: var(--gold); }
.dnpanel small { color: var(--mut); font-size: 11px; } .dnpanel .btn { font-size: 12.5px; padding: 7px 8px; }
.dnfeed { position: absolute; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); width: min(340px, 56vw); display: flex; flex-direction: column; gap: 4px; z-index: 30; pointer-events: none; }
.dnl { background: rgba(14,18,42,.78); border: 1px solid rgba(255,210,63,.4); border-radius: 12px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; animation: pop .2s; overflow-wrap: anywhere; }
.dnact { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.dnlist { display: flex; flex-direction: column; gap: 6px; } .dnli { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 6px 10px; } .dnli img, .dnli .ph { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.08); }
.dnli span:not(.ph):not(.rk) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .dnli b { color: var(--gold); white-space: nowrap; } .dnli .rk { width: 26px; color: var(--mut); font-weight: 800; }
.dnprev { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; border: 1px solid var(--line); }
.langlist { display: flex; flex-direction: column; gap: 6px; max-height: 44vh; overflow-y: auto; margin-top: 8px; } .langlist .btn { justify-content: flex-start; padding: 10px 14px; font-size: 15px; }

.blbtn { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(120,200,255,.5); background: linear-gradient(135deg,#2b3a67,#1b2447); color: #cfe8ff; font: 700 14px/1 inherit; box-shadow: 0 6px 20px rgba(0,0,0,.4),0 0 14px rgba(90,170,255,.3); cursor: pointer; z-index: 5; }
.blbtn:active { transform: translateX(-50%) scale(.96); }
body.blopen .stool, body.blopen .spanel { opacity: .35; }
.blender { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 46%; max-height: 520px; display: flex; flex-direction: column; background: rgba(14,18,32,.97); border: 1px solid rgba(120,200,255,.35); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.6); z-index: 80; overflow: hidden; color: #e6eeff; pointer-events: auto; }
body.blbig .stool, body.blbig .spanel, body.blbig .blbtn { display: none !important; }
.bled { display: flex; gap: 4px; padding: 4px 6px; overflow-x: auto; background: rgba(255,255,255,.04); flex: none; touch-action: pan-x; }
.bleb { flex: none; min-width: 32px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid rgba(120,200,255,.3); background: #1b2447; color: #e6eeff; font: 700 14px/1 ui-monospace,Menlo,monospace; cursor: pointer; }
.bleb.w { font-family: inherit; font-size: 12px; background: #2b3a67; }
.bleb:active { background: #3b5bd9; }
.blender.big { top: 6px; height: auto; max-height: none; bottom: 6px; }
.blh, .blf { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(255,255,255,.05); }
.blh .blt { margin-right: auto; font-size: 15px; }
.blh .xbtn { position: static; }
.blmain { flex: 1; display: flex; min-height: 90px; background: #0b0f1c; }
.blgut { width: 38px; padding: 8px 6px; text-align: right; color: #5d6b92; font: 12px/18px ui-monospace,Menlo,Consolas,monospace; overflow: hidden; white-space: pre; user-select: none; background: #0e1424; }
.blcode { flex: 1; resize: none; border: 0; outline: 0; padding: 8px; background: transparent; color: #d6e4ff; font: 12px/18px ui-monospace,Menlo,Consolas,monospace; white-space: pre; overflow: auto; tab-size: 2; }
.blpar { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 10px; background: rgba(90,170,255,.08); max-height: 90px; overflow: auto; }

const FAB_ID = 'friend-a-bot';
function friendABotGame() {

  tool('spawn', [0, .2, -55]);
  /* plaza, pagar */
  part('cylinder', [0, .15, 0], [64, .3, 64], '#d9d2c5');
  part('cube', [0, 3.5, -70.5], [142, 7, 1], '#f1f3fa'); part('cube', [0, 3.5, 70.5], [142, 7, 1], '#f1f3fa');
  part('cube', [-70.5, 3.5, 0], [1, 7, 142], '#f1f3fa'); part('cube', [70.5, 3.5, 0], [1, 7, 142], '#f1f3fa');
  /* air pancut */

  part('cylinder', [0, 4.5, 0], [3.5, 9, 3.5], '#b8c4de'); part('sphere', [0, 10, 0], [5, 5, 5], '#7fdcff');
  /* bangku: 4 buah mengelilingi air pancut, 2 bot setiap satu */
  const seats = [];
  [[24, 0], [-24, 0], [0, 24], [0, -24]].forEach(c => {
    const d = Math.hypot(c[0], c[1]), ux = -c[0] / d, uz = -c[1] / d, tx = -uz, tz = ux, alongZ = Math.abs(c[0]) > Math.abs(c[1]);
    part('cube', [c[0], 1, c[1]], alongZ ? [3, 2, 8] : [8, 2, 3], '#c98b4b');
    part('cube', [c[0] - ux * 1.9, 3.6, c[1] - uz * 1.9], alongZ ? [.8, 3.6, 8] : [8, 3.6, .8], '#a8703a');
    [-2, 2].forEach(k => seats.push([c[0] + tx * k, 2, c[1] + tz * k, Math.atan2(ux, uz)]));
  });
  /* kotak pasir */
  part('cube', [-34, .2, 30], [18, .4, 18], '#ecd08f');
  const sand = [[-38, .4, 27], [-31, .4, 33], [-37, .4, 34]].map(p => p.concat([R() * 6.28]));
  /* gelongsor (naik dari sisi rendah), trampolin, kuda pusing, peti */
  part('wedge', [-50, 4.5, -32], [16, 9, 8], '#2ec46a');
  [[40, -26], [49, -26], [44.5, -18]].forEach(p => tool('bounce', [p[0], .4, p[1]], '#ffd23f'));
  part('cylinder', [-42, .5, 6], [14, 1, 14], '#ff7ab8'); part('cylinder', [-42, 3.5, 6], [1.2, 6, 1.2], '#7a5cff');
  [[40, 0, 40], [44.2, 0, 40], [42.1, 4, 40]].forEach(p => tool('crate', p));
  [[-62, -62], [-62, -30], [-62, 0], [-62, 30], [-62, 62], [62, -62], [62, -30], [62, 0], [62, 30], [62, 62], [-30, 63], [0, 63], [30, 63], [-30, -63], [30, -63]].forEach(p => tool('tree', [p[0], 0, p[1]], pick(['#2e9e4f', '#3fb55f', '#278a45'], R)));
  [[34, 34], [-34, -34], [34, -34], [-34, 34], [0, -40], [0, 42]].forEach(p => tool('lamp', [p[0], 0, p[1]], '#ffe27a'));
  [[55, 14], [58, -12], [-56, 50], [20, 55], [-20, -52]].forEach(p => tool('rock', [p[0], 0, p[1]], '#8d96a3'));
  /* bot */
  const names = BOT_NAMES.slice(0, 24).sort((a, b) => ((a.charCodeAt(0) * 7) % 13) - ((b.charCodeAt(0) * 7) % 13));
